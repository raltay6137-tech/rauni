<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recep Altay Üniversitesi | Geleceğe Güvenle</title>
    <style>
        /* Temel Sıfırlamalar ve Font */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* Üst Kurumsal Bar (Top Bar) */
        .top-bar {
            background-color: #0f2042;
            color: #fff;
            padding: 8px 5%;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .top-bar a {
            color: #ccc;
            text-decoration: none;
            margin-left: 15px;
        }

        .top-bar a:hover {
            color: #fff;
        }

        /* Logolu Ana Header */
        header {
            background-color: #fff;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #d3a247; /* Üniversite Altın Sarısı */
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-placeholder {
            width: 70px;
            height: 70px;
            background-color: #0f2042;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            border: 2px solid #d3a247;
        }

        .logo-text h1 {
            font-size: 22px;
            color: #0f2042;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        /* Navigasyon Menüsü */
        nav {
            background-color: #162e5c;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            list-style: none;
            padding: 0 5%;
        }

        .nav-container li {
            position: relative;
        }

        .nav-container a {
            display: block;
            padding: 15px 20px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .nav-container a:hover {
            background-color: #d3a247;
            color: #0f2042;
        }

        /* Vitrin / Slider Alanı */
        .hero-slider {
            width: 100%;
            height: 450px;
            position: relative;
            overflow: hidden;
        }

        .hero-slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider-caption {
            position: absolute;
            bottom: 40px;
            left: 5%;
            background-color: rgba(15, 32, 66, 0.85);
            color: #fff;
            padding: 20px;
            border-left: 5px solid #d3a247;
            max-width: 500px;
        }

        /* Ana İçerik Grid Yapısı */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        /* Kart Yapıları */
        .section-title {
            font-size: 20px;
            color: #0f2042;
            margin-bottom: 20px;
            border-bottom: 2px solid #162e5c;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-news {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }
